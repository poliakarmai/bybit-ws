# ruff для bybit-ws.

# BLE001 (blind except) и S110 (try/except/pass) — осознанный контракт живого
# цикла: падение одной стратегии или телеметрии не должно убивать 30-секундный
# цикл. Всё остальное линтер проверяет.
#
# gridsignal-bot.py — legacy бот, заменён gridsignal_scanner.py, но на нём висит
# живой тест test_async_blocking_gridsignal.py (сканирует на async-блокировки) —
# в линт не берём.
exclude = [
    "gridsignal-bot.py",
]

[lint]
ignore = ["BLE001", "S110", "N999"]  # N999: __init__.py/__main__.py — стандартные dunder-файлы
