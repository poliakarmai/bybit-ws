[mypy]
python_version = 3.12
# Только контракт journal-схемы (TypedDict PerSymbolStats/JournalResult),
# не полная типизация 86k строк. follow_imports=skip: чужие модули не проверяем.
ignore_missing_imports = True
follow_imports = skip
no_implicit_optional = False
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
warn_unused_ignores = False

[mypy-bybit_ws.journal.self_learn]
# 59 предсуществующих type-ошибок в self_learn.py (bandit/drift/ensemble, частично
# типизированный живой код) — НЕ часть контракта journal-схемы, отдельная чистка.
# Контракт консьюмера (apply_journal_insights читает per_symbol) закрыт runtime-тестом
# tests/test_per_symbol_wiring.py. Здесь — только не генерить шум от живого кода.
ignore_errors = True
