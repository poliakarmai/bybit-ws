[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-ws"
version = "11.5.0"
description = "AI-Native Trading Engine — Bollinger Grid × 8 strategies, REST API + MCP"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [
    {name = "Alexey Poliakov", email = "poliakarm@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # синхронизировано с requirements.txt — иначе `pip install .` ставит
    # неполный набор и падает на первом же импорте (filelock, numpy, pandas…)
    "aiohttp>=3.8",
    "filelock>=3.9",
    "httpx>=0.24",
    "matplotlib>=3.7",
    "mcp>=1.0,<2",
    "mplfinance==0.12.10b0",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyJWT>=2.8",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/poliakarmai/bybit-ws"
Repository = "https://github.com/poliakarmai/bybit-ws.git"
Issues = "https://github.com/poliakarmai/bybit-ws/issues"

[project.scripts]
bybit-ws-mcp = "mcp_server:cli"

[tool.setuptools]
# mcp_server.py лежит в корне и не входит в пакет bybit_ws — без этого
# `pip install` не поставит MCP-сервер (главная точка входа для агентов).
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
include = ["bybit_ws*"]

[tool.mypy]
# Симлинк-структура (bybit_ws/*.py -> ../*.py) + root __init__.py в папке с дефисом
# «bybit-ws» ломают стандартный package-discovery mypy. explicit_package_bases +
# mypy_path=. заставляют mypy резолвить пакет как bybit_ws (underscore).
# follow_imports=skip — проверяем только тела целевых модулей, не тянем транзитивно
# весь репо (в exchange_adapter/constants есть своя недоделанная типизация).
files = [
    "bybit_ws/file_utils.py",
    "bybit_ws/config.py",
    "bybit_ws/state_db.py",
    "bybit_ws/api.py",
]
explicit_package_bases = true
mypy_path = "."
follow_imports = "skip"
ignore_missing_imports = true
