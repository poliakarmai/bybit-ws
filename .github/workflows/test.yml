name: Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt 2>/dev/null || true
      - name: Smoke tests
        run: python3 test_smoke.py
      - name: Module tests
        run: python3 test_modules.py

  gsc-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GSC security scan
        run: |
          pip install gsc 2>/dev/null || pip install git+https://github.com/poliakarmai/gsc.git
          gsc scan . --ci --json || true
