name: Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned, GSC-009)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned, GSC-009)
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax + async blocking guard
        run: |
          python3 -m py_compile gridsignal-bot.py main_async.py rpc.py auto_entry.py unified_sl.py
          python3 -m pytest test_async_blocking_gridsignal.py -q
      - name: Smoke tests
        run: python3 test_smoke.py
      - name: Module tests
        run: python3 test_modules.py
      - name: Logic integrity tests
        run: python3 test_logic_integrity.py
      - name: Regression tests
        run: python3 test_regression.py
      - name: Self-learn tests
        run: python3 test_selflearn.py

  gsc-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned, GSC-009)
        with:
          fetch-depth: 0
      - name: GSC security scan
        run: |
          pip install gsc 2>/dev/null || pip install git+https://github.com/poliakarmai/gsc.git
          gsc scan . --ci --json || true
