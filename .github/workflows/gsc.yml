name: GSC Audit
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned, GSC-009)
      - uses: poliakarmai/gsc@937dfd89fac4762594b5258158c750b98cfd3bef  # v1 (pinned, GSC-009)
        with:
          fail_on_critical: false
          deep_scan: false
