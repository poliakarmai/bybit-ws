# bybit-ws configuration
# Path: ~/.config/bybit-ws/config.yaml
# Copy this file to config.yaml and fill in your values.
#
# Environment variables (${VAR}) are substituted at load time.
# Use ${VAR:-default} for fallback values.

# ── Bybit API credentials ─────────────────────────────────────────────────────
api:
  key: "${BYBIT_API_KEY}"
  secret: "${BYBIT_API_SECRET}"
  base_url: "https://api.bytick.com"    # mainnet; testnet: https://api-testnet.bybit.com
  retry_count: 3
  retry_backoff: [1, 3, 10]             # seconds between retries
  timeout: 30

# ── Strategy parameters ───────────────────────────────────────────────────────
strategy:

  # LONG: Bollinger Grid with limit orders below Lower BB (Daily)
  long:
    leverage: 3
    margin_tiers:                        # score → margin (deprecated in v3.8, see position_sizing)
      7: 15                               #   score >= 7
      5.5: 10                             #   score >= 5.5
      0: 5                                #   score < 5.5
    entry_offset: 0.03                   # -3% below Lower BB
    sl_offset: 0.07                      # -7% from Lower BB
    tp_middle_pct: 0.20                  # 20% of TP on Middle BB
    tp_upper_pct: 0.80                   # 80% of TP on Upper BB
    max_positions: 15                    # max simultaneous LONG positions
    cooldown_after_sl: 14400             # 4h pause after SL before re-entry
    cooldown_after_tp: 3600              # 1h pause after TP

  # SHORT: Bollinger Grid overbought + DCA on pumps
  short:
    leverage: 3
    margin: 10                           # USD per short (deprecated in v3.8)
    entry_offset: 0.02                   # +2% above market for limit order
    sl_tier_ab: 0.05                     # +5% SL for Tier A/B
    sl_tier_cd: 0.07                     # +7% SL for Tier C/D
    bb_threshold: 85                     # BB% > threshold → short candidate
    max_positions: 3                     # max simultaneous shorts
    cooldown_seconds: 7200               # 2h cooldown per symbol
    max_short_pct: 20                    # max % of portfolio in shorts
    max_hold_hours: 72                   # auto-close short after 72h
    instant_tp_symbols: []     # symbols to close at ANY profit (for testing)
    junk_daily_pump_threshold: 0.80      # min daily pump for junk short (80%)
    junk_dca_levels: [1.0, 1.2]          # DCA ladder: +100%, +120% from entry

  # DCA: add to losing positions at lower levels
  dca:
    enabled: true
    levels: [0.95, 0.90, 0.85]          # -5%, -10%, -15% from entry
    multiplier: 2                        # 2x size on each DCA level
    max_margin_per_symbol: 80            # cap total margin per symbol ($80)
    max_dca_count: 2                     # max 2 DCA additions per position

  # X10 Strategy Pack: high-leverage with strict risk limits
  x10:
    max_daily_losses: 3                  # stop all x10 after N losing trades/day
    cooldown_after_stop_hours: 24        # auto-resume after 24h
    require_atr_validation: true         # ATR check before every x10 entry
    max_position_risk_pct: 2.0           # max risk per position (% of balance)

  # Junk shorts: meme/shitcoin pumps without SL
  junk:
    enabled: false                       # disabled by default — enable carefully
    min_pump_pct: 80                     # enter when daily pump ≥ 80%
    dca_levels: [1.0, 1.2]               # +100%, +120% from entry
    max_loss_pct: 15                     # hard stop: close at -15% loss
    max_hold_hours: 48                   # auto-close after 48h
    max_positions: 2                     # max 2 junk positions

# ── Position Sizing v3.8 ──────────────────────────────────────────────────────
# Dynamic margin = deposit × risk_pct / max_positions × score_multiplier.
# Replaces fixed margin_tiers in strategy sections.
position_sizing:
  enabled: true                          # false = use legacy fixed margins
  long_risk_pct: 0.20                    # 20% of deposit at risk (LONG/SHORT 3x)
  x10_risk_pct: 0.05                     # 5% of deposit at risk (x10 strategies)
  dca_risk_pct: 0.10                     # 10% for DCA entries
  pump_risk_pct: 0.06                    # 6% for pump shorts
  max_positions: 5                       # used for base allocation
  min_margin: 5.0                        # floor: Bybit $5 minimum
  max_position_share: 0.40               # cap: max 40% of risk budget per position
  score_multipliers:                     # conviction → position size
    8.5: 1.4                             #   very high confidence
    7.5: 1.15                            #   high confidence
    6.5: 1.0                             #   normal confidence
    5.5: 0.75                            #   low confidence

# ── Watchlist ──────────────────────────────────────────────────────────────────
watchlist:
  mode: "top"                            # top | fixed
  top_n: 50
  exclude: ["BTCUSDT", "ETHUSDT"]        # exclude from monitoring
  # fixed: ["SOLUSDT", "ADAUSDT"]        # used when mode=fixed

# ── Tiers ─────────────────────────────────────────────────────────────────────
tiers:
  S: ["BTCUSDT", "ETHUSDT"]
  A:
    - "SOLUSDT"
    - "LTCUSDT"
    - "XRPUSDT"
    - "ADAUSDT"
    - "DOTUSDT"
    - "LINKUSDT"
    - "UNIUSDT"
    - "AVAXUSDT"
    - "SUIUSDT"
    - "NEARUSDT"
    - "APTUSDT"
  B:
    - "ARBUSDT"
    - "OPUSDT"
    - "AAVEUSDT"
    - "INJUSDT"
    - "ONDOUSDT"
    - "ENAUSDT"
    - "FETUSDT"
    - "WLDUSDT"
    - "ATOMUSDT"
    - "ALGOUSDT"
    - "RUNEUSDT"
  # These symbols NEVER short (one-way mode)
  one_way:
    - "XRPUSDT"
    - "ONDOUSDT"
    - "WLFIUSDT"
    - "ENJUSDT"
    - "ESPORTSUSDT"
    - "AVAXUSDT"
    - "APTUSDT"
    - "SUIUSDT"

# ── Monitor ───────────────────────────────────────────────────────────────────
monitor:
  cycle_seconds: 30                      # main loop interval
  heavy_cycle: 10                        # heavy checks every N cycles (~5 min)
  watchdog_seconds: 180                  # kill process if main loop hangs

# ── RPC Server ────────────────────────────────────────────────────────────────
rpc:
  port: 8766
  bind: "127.0.0.1"                      # localhost only; use 0.0.0.0 for Docker
  auth_token: "${RPC_TOKEN}"             # Bearer token (empty = no auth)
  rate_limit_per_min: 60                 # max requests/min per IP

# ── Risk Management ───────────────────────────────────────────────────────────
risk:
  max_drawdown_pct: 15                   # global stop: -15% from peak → close all
  max_total_margin: 500                  # cap total margin in all positions
  max_daily_loss: 50                     # stop trading for the day at -$50
  max_long_positions: 12                 # limit LONG entries
  emergency_close_all: true              # close all positions on max_drawdown
  drawdown_mode: "peak"                  # peak (from highest) or start (from initial)
  drawdown_reset_hours: 24               # auto-resume after N hours
  max_per_sector: 3                      # max positions per sector
  banned_symbols: []                     # permanent ban list, e.g. ["BLESSUSDT"]
  sectors:                               # sector classification for correlation check
    L1: ["SOLUSDT", "SUIUSDT", "APTUSDT", "NEARUSDT", "AVAXUSDT", "ADAUSDT", "DOTUSDT"]
    DeFi: ["AAVEUSDT", "UNIUSDT", "INJUSDT", "RUNEUSDT"]
    AI: ["FETUSDT", "WLDUSDT"]
    Meme: ["DOGEUSDT"]

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  max_size_mb: 50                        # rotate events.log at 50 MB
  max_files: 7                           # keep up to 7 rotated files
  format: "json"                         # json or text
  trades_max_size_mb: 100                # rotate trades.jsonl at 100 MB
  trades_archive: true                   # archive old trades as .gz

# ── Alerts ────────────────────────────────────────────────────────────────────
alerts:
  telegram_enabled: false                # set true for Telegram alerts
  correlation_threshold: 0.80            # alert when correlation > ±0.8
  sl_alert: true
  tp_alert: true
