# =============================================================================
# bybit-ws — конфигурация торгового монитора (Bollinger Grid + X10 стратегии)
# =============================================================================
#
# Путь установки: ~/.config/bybit-ws/config.yaml
#
# ИНСТРУКЦИЯ:
#   1. Скопируйте этот файл: cp config.example.yaml ~/.config/bybit-ws/config.yaml
#   2. Заполните API-ключи в секции `api.key` и `api.secret`
#      (или задайте переменные окружения BYBIT_API_KEY / BYBIT_API_SECRET)
#   3. Настройте риск-параметры под ваш депозит в секции `risk`
#   4. При необходимости скорректируйте списки монет в `tiers`
#   5. Запустите: python -m bybit-ws
#
# Переменные окружения подставляются автоматически:
#   ${VAR}        — значение переменной VAR
#   ${VAR:-def}   — значение VAR или 'def' если переменная не задана
#
# ВСЕ параметры имеют значения по умолчанию (показаны ниже).
# Удалите или закомментируйте строки, которые не хотите менять.
# =============================================================================

# ═══════════════════════════════════════════════════════════════════════════════
# 1. BYBIT API — подключение к бирже
# ═══════════════════════════════════════════════════════════════════════════════
api:
  # API-ключ (создать в Bybit → Account → API Management)
  # Тип: строка | По умолчанию: ${BYBIT_API_KEY}
  key: "${BYBIT_API_KEY}"

  # API-секрет
  # Тип: строка | По умолчанию: ${BYBIT_API_SECRET}
  secret: "${BYBIT_API_SECRET}"

  # Базовый URL API
  # Тип: строка (URL)
  #   mainnet:  https://api.bytick.com
  #   testnet:  https://api-testnet.bybit.com
  # По умолчанию: https://api.bytick.com
  base_url: "https://api.bytick.com"

  # Режим тестовой сети (true = testnet, false = mainnet)
  # При testnet=true base_url автоматически меняется на api-testnet.bybit.com
  # Тип: bool | По умолчанию: false
  testnet: false

  # Окно валидности подписи запроса в миллисекундах
  # Диапазон: 1000–10000 | По умолчанию: 5000
  recv_window: 5000

  # Таймаут HTTP-запроса в секундах
  # Диапазон: 5–120 | По умолчанию: 30
  timeout: 30

  # Количество повторных попыток при ошибках сети / 429 / 5xx
  # Диапазон: 0–10 | По умолчанию: 3
  retry_count: 3

  # Задержки между повторными попытками (секунды)
  # Тип: список целых чисел | По умолчанию: [1, 3, 10]
  retry_backoff: [1, 3, 10]

# ═══════════════════════════════════════════════════════════════════════════════
# 2. STRATEGY — параметры торговых стратегий
# ═══════════════════════════════════════════════════════════════════════════════
strategy:

  # ── LONG (Bollinger Grid) ──────────────────────────────────────────────────
  # Вход при касании Lower BB (дневной), цель — возврат к Middle/Upper BB.
  # Плечо 3x, лимитные ордера.
  long:
    # Плечо для LONG-позиций
    # Диапазон: 1–10 | По умолчанию: 3
    leverage: 3

    # Порог BB% для входа в LONG (BB% = позиция цены внутри полос Боллинджера)
    # Чем ниже — тем ближе к Lower BB. Рекомендуется 20-30.
    # Диапазон: 0–50 | По умолчанию: 25 (неявный, из кода bb_scalp/backtest)
    bb_threshold: 25

    # Порог ML-скора для фильтрации сигналов (0-10, чем выше — тем увереннее)
    # Сигналы с оценкой ниже порога игнорируются.
    # Диапазон: 0.0–10.0 | По умолчанию: 5.5
    score_threshold: 5.5

    # Маржинальные уровни по скору (score → USD маржи)
    # Устарело в v3.8 — заменено на position_sizing. Оставлено для совместимости.
    # По умолчанию: {7: 15, 5.5: 10, 0: 5}
    margin_tiers:
      7: 15       # score >= 7 → $15 маржи
      5.5: 10     # score >= 5.5 → $10 маржи
      0: 5        # score < 5.5 → $5 маржи

    # Смещение цены входа ОТНОСИТЕЛЬНО Lower BB
    # entry = Lower_BB * (1 - entry_offset). Например 0.03 = −3% ниже Lower BB.
    # Диапазон: 0.0–0.15 | По умолчанию: 0.03
    entry_offset: 0.03

    # Смещение стоп-лосса ОТНОСИТЕЛЬНО Lower BB
    # SL = Lower_BB * (1 - sl_offset). Например 0.07 = −7% от Lower BB.
    # Диапазон: 0.02–0.20 | По умолчанию: 0.07
    sl_pct: 0.07

    # Режим тейк-профита: partial (частичный 20/80) или full (полный на Middle)
    # Тип: строка | Значения: "partial", "full" | По умолчанию: "partial"
    tp_mode: "partial"

    # Доля позиции, закрываемая на Middle BB (режим partial)
    # Диапазон: 0.0–1.0 | По умолчанию: 0.20 (20%)
    tp_middle_pct: 0.20

    # Доля позиции, закрываемая на Upper BB (режим partial)
    # Диапазон: 0.0–1.0 | По умолчанию: 0.80 (80%)
    tp_upper_pct: 0.80

    # Максимальное количество одновременных LONG-позиций
    # Диапазон: 1–50 | По умолчанию: 15
    max_positions: 15

    # Кулдаун после стоп-лосса (секунды) — запрет повторного входа в тот же символ
    # 14400 = 4 часа
    # Диапазон: 0–86400 | По умолчанию: 14400
    cooldown_after_sl: 14400

    # Кулдаун после тейк-профита (секунды)
    # 3600 = 1 час
    # Диапазон: 0–86400 | По умолчанию: 3600
    cooldown_after_tp: 3600

  # ── SHORT (Bollinger Grid) ─────────────────────────────────────────────────
  # Вход при перекупленности (BB% > порог), цель — возврат к Middle BB.
  # Плечо 3x, лимитные ордера.
  short:
    # Плечо для SHORT-позиций
    # Диапазон: 1–10 | По умолчанию: 3
    leverage: 3

    # Фиксированная маржа на SHORT (USD) — устарело в v3.8, см. position_sizing
    # Диапазон: 5–500 | По умолчанию: 10
    margin: 10

    # Порог BB% для входа в SHORT (цена у Upper BB)
    # BB% > threshold → кандидат на SHORT
    # Диапазон: 50–100 | По умолчанию: 85
    bb_threshold: 85

    # Смещение цены входа ВВЕРХ от рынка для лимитного ордера
    # entry = market * (1 + entry_offset). Например 0.02 = +2% выше рынка.
    # Диапазон: 0.0–0.10 | По умолчанию: 0.02
    entry_offset: 0.02

    # Стоп-лосс для Tier A/B монет (% от входа)
    # SL = entry * (1 + sl_tier_ab). Например 0.05 = +5%.
    # Диапазон: 0.01–0.20 | По умолчанию: 0.05
    sl_tier_ab: 0.05

    # Стоп-лосс для Tier C/D монет (% от входа) — более широкий из-за волатильности
    # Диапазон: 0.02–0.30 | По умолчанию: 0.07
    sl_tier_cd: 0.07

    # Максимальное количество одновременных SHORT-позиций
    # Диапазон: 0–20 | По умолчанию: 3
    max_positions: 3

    # Кулдаун между SHORT-входами в один символ (секунды)
    # 7200 = 2 часа
    # Диапазон: 0–86400 | По умолчанию: 7200
    cooldown_seconds: 7200

    # Максимальный % шортов от общего числа позиций (0-100)
    # Диапазон: 0–100 | По умолчанию: 20
    max_short_pct: 20

    # Авто-закрытие SHORT через N часов, если не сработал TP/SL
    # Диапазон: 1–720 | По умолчанию: 72
    max_hold_hours: 72

    # Символы с мгновенным TP (закрыть при ЛЮБОМ профите)
    # Тип: список строк | По умолчанию: []
    instant_tp_symbols: []

  # ── REENTRY (повторный вход после стоп-лосса) ─────────────────────────────
  # После срабатывания SL по LONG-позиции выставляется лесенка лимитных
  # ордеров на покупку ниже цены SL. Цель: поймать отскок.
  reentry:
    # Режим повторного входа
    #   simple — один ордер на Lower BB Daily
    #   ladder — лесенка из N ордеров на уровнях ниже SL
    # Тип: строка | Значения: "simple", "ladder" | По умолчанию: "ladder"
    mode: "ladder"

    # Уровни лесенки (множители к SL-цене)
    # [0.95, 0.90, 0.85] = ордера на −5%, −10%, −15% ниже SL
    # Тип: список дробных чисел | По умолчанию: [0.95, 0.90, 0.85]
    levels: [0.95, 0.90, 0.85]

    # Маржа на каждый уровень (USD)
    # Диапазон: 5–200 | По умолчанию: 10
    margin: 10

    # Плечо для re-entry позиций
    # Диапазон: 1–10 | По умолчанию: 3
    leverage: 3

    # Кулдаун между re-entry попытками в один символ (секунды)
    # 14400 = 4 часа
    # Диапазон: 3600–86400 | По умолчанию: 14400
    cooldown: 14400

    # Максимальное количество re-entry попыток на символ (за всё время)
    # После исчерпания лимита символ исключается из re-entry очереди
    # Диапазон: 1–10 | По умолчанию: 2
    max_reentries: 2

  # ── DCA (усреднение убыточных позиций) ────────────────────────────────────
  # Добавление к LONG-позиции при падении цены на заданные уровни.
  dca:
    # Включить/выключить DCA
    # Тип: bool | По умолчанию: true
    enabled: true

    # Уровни для добавок (множители к цене входа)
    # [0.95, 0.90, 0.85] = −5%, −10%, −15% от входа
    # Тип: список дробных чисел | По умолчанию: [0.95, 0.90, 0.85]
    levels: [0.95, 0.90, 0.85]

    # Множитель размера на каждом уровне
    # 2 = удвоение позиции на каждом DCA-уровне
    # Диапазон: 1.0–5.0 | По умолчанию: 2
    multiplier: 2

    # Максимальная суммарная маржа на один символ (USD)
    # Диапазон: 10–1000 | По умолчанию: 80
    max_margin_per_symbol: 80

    # Максимальное количество DCA-добавок на позицию
    # Диапазон: 1–5 | По умолчанию: 2
    max_dca_count: 2

  # ── JUNK (шлак-шорты на мемкоинах после пампов) ──────────────────────────
  # Вход в SHORT при дневном пампе ≥ порога. ВЫКЛЮЧЕН по умолчанию.
  junk:
    # Включить/выключить JUNK-стратегию (ОСТОРОЖНО: высокий риск)
    # Тип: bool | По умолчанию: false
    enabled: false

    # Минимальный дневной рост для входа в шорт (%)
    # Например 80 = актив вырос на 80%+ за день
    # Диапазон: 30–500 | По умолчанию: 80
    daily_pump_threshold: 80

    # DCA-лесенка (множители к цене входа): +100%, +120%
    # Тип: список дробных чисел | По умолчанию: [1.0, 1.2]
    dca_levels: [1.0, 1.2]

    # Hard-stop: закрыть позицию при убытке −N% по марже
    # Диапазон: 5–50 | По умолчанию: 15
    max_loss_pct: 15

    # Авто-закрытие позиции через N часов, если не сработал TP/SL
    # Диапазон: 1–168 | По умолчанию: 48
    max_hold_hours: 48

    # Максимальное количество одновременных шлак-шортов
    # Диапазон: 1–10 | По умолчанию: 2
    max_positions: 2

# ═══════════════════════════════════════════════════════════════════════════════
# 3. TIERS — классификация торговых пар
# ═══════════════════════════════════════════════════════════════════════════════
tiers:
  # Tier S — базовая корзина (BTC/ETH), не участвуют в активной торговле
  S: ["BTCUSDT", "ETHUSDT"]

  # Tier A — высоколиквидные монеты (основной пул LONG/SHORT)
  # Рекомендация: топ-15 по объёму на Bybit
  A:
    - "SOLUSDT"
    - "LTCUSDT"
    - "XRPUSDT"
    - "ADAUSDT"
    - "DOTUSDT"
    - "LINKUSDT"
    - "UNIUSDT"
    - "AVAXUSDT"
    - "SUIUSDT"
    - "NEARUSDT"
    - "APTUSDT"

  # Tier B — среднеликвидные монеты (ограниченное количество позиций)
  B:
    - "ARBUSDT"
    - "OPUSDT"
    - "AAVEUSDT"
    - "INJUSDT"
    - "ONDOUSDT"
    - "ENAUSDT"
    - "FETUSDT"
    - "WLDUSDT"
    - "ATOMUSDT"
    - "ALGOUSDT"
    - "RUNEUSDT"

  # One-Way — монеты, для которых ЗАПРЕЩЁН SHORT (только LONG)
  # Обычно: монеты с положительным фондингом, нарративные, DeFi-токены.
  one_way:
    - "XRPUSDT"
    - "ONDOUSDT"
    - "WLFIUSDT"
    - "ENJUSDT"
    - "ESPORTSUSDT"
    - "AVAXUSDT"
    - "APTUSDT"
    - "SUIUSDT"

# ═══════════════════════════════════════════════════════════════════════════════
# 4. RISK — управление рисками
# ═══════════════════════════════════════════════════════════════════════════════
risk:
  # Максимальная просадка от пикового баланса (%)
  # При достижении — аварийное закрытие ВСЕХ позиций (если emergency_close_all=true)
  # Диапазон: 5–50 | По умолчанию: 15
  max_drawdown_pct: 15

  # Максимальная суммарная маржа во всех позициях (USD)
  # Диапазон: 50–10000 | По умолчанию: 500
  max_total_margin: 500

  # Максимальный дневной убыток (USD) — при превышении торговля останавливается до конца дня
  # Диапазон: 10–5000 | По умолчанию: 50
  max_daily_loss: 50

  # Максимальное количество LONG-позиций (доп. ограничение поверх strategy.long.max_positions)
  # Диапазон: 1–50 | По умолчанию: 12
  max_long_positions: 12

  # Максимальное количество позиций в ОДНОМ тире (A или B)
  # Например: не более 5 позиций Tier A одновременно
  # Диапазон: 1–20 | По умолчанию: 0 (нет ограничения)
  max_positions_per_tier: 0

  # Порог корреляции для блокировки входов
  # Если корреляция BTC с альтами > порога — новые входы запрещены
  # Диапазон: 0.0–1.0 | По умолчанию: 0.80
  correlation_threshold: 0.80

  # Аварийное закрытие ВСЕХ позиций при достижении max_drawdown_pct
  # Тип: bool | По умолчанию: true
  emergency_close_all: true

  # Режим расчёта просадки:
  #   peak  — от пикового баланса (максимум за всё время)
  #   start — от начального баланса
  # Тип: строка | Значения: "peak", "start" | По умолчанию: "peak"
  drawdown_mode: "peak"

  # Авто-сброс паузы после emergency через N часов
  # Диапазон: 1–168 | По умолчанию: 24
  drawdown_reset_hours: 24

  # Максимальное количество позиций в одном секторе
  # Предотвращает концентрацию риска (например, не более 3 AI-монет)
  # Диапазон: 1–10 | По умолчанию: 3
  max_per_sector: 3

  # Перманентный бан-лист — эти символы НИКОГДА не открываются
  # Пример: ["BLESSUSDT", "SCAMUSDT"]
  # Тип: список строк | По умолчанию: []
  banned_symbols: []

  # Классификация по секторам (для расчёта корреляции и лимитов)
  sectors:
    L1: ["SOLUSDT", "SUIUSDT", "APTUSDT", "NEARUSDT", "AVAXUSDT", "ADAUSDT", "DOTUSDT"]
    DeFi: ["AAVEUSDT", "UNIUSDT", "INJUSDT", "RUNEUSDT"]
    AI: ["FETUSDT", "WLDUSDT"]
    Meme: ["DOGEUSDT"]

# ═══════════════════════════════════════════════════════════════════════════════
# 5. MONITORING — интервалы проверок и RPC-сервер
# ═══════════════════════════════════════════════════════════════════════════════
monitoring:
  # Интервал главного цикла (секунды)
  # Каждые N секунд: проверка позиций, авто-SL, авто-безубыток
  # Диапазон: 10–300 | По умолчанию: 30
  cycle_interval_seconds: 30

  # Тяжёлые проверки каждые N циклов
  # При cycle_interval=30 и heavy_cycle=10 → тяжёлая проверка каждые 5 минут
  # Тяжёлая проверка: сканирование сигналов, DCA, SHORT-входы, reentry
  # Диапазон: 1–60 | По умолчанию: 10
  heavy_cycle_interval: 10

  # X10-стратегии каждые N циклов
  # При cycle_interval=30 и x10_cycle=20 → X10 каждые 10 минут
  # X10: скальпинг (M5), mean-revert (D), фондинг-моментум
  # Диапазон: 1–120 | По умолчанию: 20 (heavy_cycle * 2)
  x10_cycle_interval: 20

  # Watchdog-таймаут (секунды)
  # Если главный цикл завис на > N секунд — процесс убивается и перезапускается systemd
  # Диапазон: 60–600 | По умолчанию: 180
  watchdog_timeout_seconds: 180

  # RPC-сервер: порт для JSON-RPC API и Prometheus /metrics
  # Диапазон: 1024–65535 | По умолчанию: 8766
  rpc_port: 8766

  # RPC-сервер: адрес для bind
  #   127.0.0.1 — только localhost (безопасно)
  #   0.0.0.0   — все интерфейсы (для Docker/удалённого доступа)
  # Тип: строка (IP) | По умолчанию: "127.0.0.1"
  rpc_bind: "127.0.0.1"

  # RPC-сервер: Bearer-токен для авторизации (пустая строка = без авторизации)
  # Тип: строка | По умолчанию: "${RPC_TOKEN}"
  rpc_auth_token: "${RPC_TOKEN}"

  # RPC-сервер: лимит запросов в минуту с одного IP
  # Диапазон: 10–600 | По умолчанию: 60
  rpc_rate_limit: 60

# ═══════════════════════════════════════════════════════════════════════════════
# 6. ALERTS — уведомления (Telegram)
# ═══════════════════════════════════════════════════════════════════════════════
alerts:
  # Включить Telegram-уведомления
  # Тип: bool | По умолчанию: false
  telegram_enabled: false

  # Telegram Chat ID (числовой или @username)
  # Получить: написать @userinfobot в Telegram
  # Тип: строка | По умолчанию: не задан
  # chat_id: "123456789"

  # Telegram Bot Token
  # Получить: создать бота через @BotFather
  # Тип: строка | По умолчанию: ${TELEGRAM_BOT_TOKEN}
  # bot_token: "${TELEGRAM_BOT_TOKEN}"

  # Порог корреляции для отправки алерта (|корреляция| > порога)
  # Диапазон: 0.0–1.0 | По умолчанию: 0.80
  correlation_threshold: 0.80

  # Алерт при срабатывании стоп-лосса
  # Тип: bool | По умолчанию: true
  sl_alert: true

  # Алерт при срабатывании тейк-профита
  # Тип: bool | По умолчанию: true
  tp_alert: true

# ═══════════════════════════════════════════════════════════════════════════════
# 7. X10 — высокорисковые стратегии с плечом 10x
# ═══════════════════════════════════════════════════════════════════════════════
x10:
  # ── Общие настройки X10 ───────────────────────────────────────────────────
  # Стоп всех X10-стратегий после N убыточных сделок за день
  # Диапазон: 1–20 | По умолчанию: 3
  max_daily_losses: 3

  # Пауза ВСЕХ X10-стратегий после стопа (часы)
  # Диапазон: 1–168 | По умолчанию: 24
  cooldown_after_stop_hours: 24

  # Обязательная ATR-проверка перед каждым X10-входом
  # Проверяет, что волатильность достаточна для покрытия SL + комиссий
  # Тип: bool | По умолчанию: true
  require_atr_validation: true

  # Максимальный риск на одну позицию (% от баланса)
  # Диапазон: 0.1–10.0 | По умолчанию: 2.0
  max_position_risk_pct: 2.0

  # ── SCALP (M5 скальпинг на отскок от BB-полосы) ──────────────────────────
  # Вход при касании Lower/Upper BB на 5-минутных свечах + RSI-фильтр.
  # Цель: быстрый возврат к Middle BB (1-5 свечей).
  scalp:
    # Включить/выключить BB-скальпинг
    # Тип: bool | По умолчанию: true
    enabled: true

    # Плечо
    # Диапазон: 5–20 | По умолчанию: 10
    leverage: 10

    # Маржа на одну скальп-позицию (USD)
    # Диапазон: 5–100 | По умолчанию: 10
    margin: 10

    # Порог BB% для входа: касание полосы
    # Используется косвенно: цена сравнивается с Lower/Upper BB
    # Диапазон: 0–100 | По умолчанию: 0 (касание)
    bb_threshold: 0

    # RSI-порог для LONG: RSI < N (перепроданность)
    # Диапазон: 10–50 | По умолчанию: 35
    rsi_threshold_long: 35

    # RSI-порог для SHORT: RSI > N (перекупленность)
    # Диапазон: 50–90 | По умолчанию: 65
    rsi_threshold_short: 65

    # Стоп-лосс (% от входа)
    # Диапазон: 0.01–0.10 | По умолчанию: 0.03 (3%)
    sl_pct: 0.03

    # Тейк-профит — цель на Middle BB (вычисляется динамически)
    # Фиксированный % не используется, цель = Middle BB
    tp_pct: 0.0

    # Максимальное количество одновременных скальп-позиций
    # Диапазон: 1–10 | По умолчанию: 3
    max_positions: 3

    # Кулдаун между скальп-входами в один символ (секунды)
    # 3600 = 1 час
    # Диапазон: 600–86400 | По умолчанию: 3600
    cooldown_seconds: 3600

  # ── MEAN REVERT (возврат к среднему на дневном BB) ───────────────────────
  # Вход при экстремальных BB% (<5% или >95%) на Daily таймфрейме.
  # Высокая вероятность возврата к Middle BB (10-20% движения).
  mean_revert:
    # Включить/выключить mean-reversion
    # Тип: bool | По умолчанию: true
    enabled: true

    # Плечо
    # Диапазон: 5–20 | По умолчанию: 10
    leverage: 10

    # Маржа на одну mean-revert позицию (USD)
    # Диапазон: 5–100 | По умолчанию: 10
    margin: 10

    # Порог BB% для LONG: BB% < N (экстремально низко — перепродано)
    # Диапазон: 1–15 | По умолчанию: 5
    bb_threshold_low: 5

    # Порог BB% для SHORT: BB% > N (экстремально высоко — перекуплено)
    # Диапазон: 85–99 | По умолчанию: 95
    bb_threshold_high: 95

    # Стоп-лосс (% от входа)
    # При x10: SL 5% = −50% маржи
    # Диапазон: 0.02–0.15 | По умолчанию: 0.05 (5%)
    sl_pct: 0.05

    # Тейк-профит — цель на Middle BB (вычисляется динамически)
    tp_pct: 0.0

    # Максимальное количество одновременных mean-revert позиций
    # Диапазон: 1–15 | По умолчанию: 5
    max_positions: 5

    # Кулдаун между mean-revert входами в один символ (секунды)
    # 7200 = 2 часа
    # Диапазон: 3600–86400 | По умолчанию: 7200
    cooldown_seconds: 7200

  # ── FUNDING (фондинг-моментум) ────────────────────────────────────────────
  # Вход при экстремальной ставке фондинга + BB-подтверждении.
  # Дополнительный доход: фондинг капает каждые 8 часов.
  funding:
    # Включить/выключить фондинг-стратегию
    # Тип: bool | По умолчанию: true
    enabled: true

    # Плечо
    # Диапазон: 5–20 | По умолчанию: 10
    leverage: 10

    # Маржа на одну фондинг-позицию (USD)
    # Диапазон: 5–100 | По умолчанию: 10
    margin: 10

    # Порог фондинга для LONG (шортисты платят лонгистам)
    # Отрицательная ставка < порога → LONG
    # Диапазон: −0.05–0.0 | По умолчанию: −0.001 (−0.1%)
    threshold_long: -0.001

    # Порог фондинга для SHORT (лонгисты платят шортистам)
    # Положительная ставка > порога → SHORT
    # Диапазон: 0.0–0.05 | По умолчанию: 0.001 (+0.1%)
    threshold_short: 0.001

    # BB-фильтр для LONG: BB% < N (цена должна быть у Lower BB)
    # Диапазон: 5–30 | По умолчанию: 15
    bb_threshold_long: 15

    # BB-фильтр для SHORT: BB% > N (цена должна быть у Upper BB)
    # Диапазон: 70–95 | По умолчанию: 85
    bb_threshold_short: 85

    # Стоп-лосс (% от входа)
    # Диапазон: 0.02–0.10 | По умолчанию: 0.04 (4%)
    sl_pct: 0.04

    # Тейк-профит — цель на Middle BB (вычисляется динамически)
    tp_pct: 0.0

    # Максимальное количество одновременных фондинг-позиций
    # Диапазон: 1–10 | По умолчанию: 3
    max_positions: 3

    # Кулдаун между фондинг-входами в один символ (секунды)
    # 14400 = 4 часа (совпадает с интервалом фондинга)
    # Диапазон: 7200–86400 | По умолчанию: 14400
    cooldown_seconds: 14400

# ═══════════════════════════════════════════════════════════════════════════════
# 8. BACKTEST — историческое тестирование стратегии
# ═══════════════════════════════════════════════════════════════════════════════
backtest:
  # Включить режим бэктеста (true = использовать исторические данные вместо live)
  # Тип: bool | По умолчанию: false
  enabled: false

  # Дата начала бэктеста (YYYY-MM-DD)
  # Тип: строка (дата) | По умолчанию: "2024-01-01"
  start_date: "2024-01-01"

  # Дата окончания бэктеста (YYYY-MM-DD)
  # Тип: строка (дата) | По умолчанию: "2024-12-31"
  end_date: "2024-12-31"

  # Начальный капитал для симуляции (USD)
  # Диапазон: 100–100000 | По умолчанию: 1000
  initial_capital: 1000

  # Таймфрейм для бэктеста
  # Тип: строка | Значения: "D", "W", "4h", "1h" | По умолчанию: "D"
  interval: "D"

  # Количество исторических свечей для walk-forward
  # Диапазон: 50–1000 | По умолчанию: 200
  candles: 200

# ═══════════════════════════════════════════════════════════════════════════════
# 9. POSITION SIZING — динамический расчёт маржи (v3.8+)
# ═══════════════════════════════════════════════════════════════════════════════
# Формула: margin = deposit × risk_pct / max_positions × score_multiplier
# Заменяет фиксированные margin_tiers в секциях стратегий.
position_sizing:
  # Включить динамический сайзинг (false = использовать фиксированные margin_tiers)
  # Тип: bool | По умолчанию: true
  enabled: true

  # Доля депозита под риском для LONG/SHORT (3x)
  # Диапазон: 0.05–0.50 | По умолчанию: 0.20 (20%)
  long_risk_pct: 0.20

  # Доля депозита под риском для X10-стратегий
  # Диапазон: 0.01–0.20 | По умолчанию: 0.05 (5%)
  x10_risk_pct: 0.05

  # Доля депозита под риском для DCA-добавок
  # Диапазон: 0.01–0.30 | По умолчанию: 0.10 (10%)
  dca_risk_pct: 0.10

  # Доля депозита под риском для памп-шортов
  # Диапазон: 0.01–0.20 | По умолчанию: 0.06 (6%)
  pump_risk_pct: 0.06

  # Базовое количество позиций для расчёта аллокации
  # Диапазон: 1–50 | По умолчанию: 5
  max_positions: 5

  # Минимальная маржа на позицию (USD) — ограничение биржи Bybit
  # Диапазон: 5–50 | По умолчанию: 5.0
  min_margin: 5.0

  # Максимальная доля рискового бюджета на одну позицию (0.40 = 40%)
  # Предотвращает концентрацию на одном символе
  # Диапазон: 0.10–1.00 | По умолчанию: 0.40
  max_position_share: 0.40

  # Минимальный депозит для торговли (USD) — ниже порога позиции не открываются
  # Диапазон: 10–500 | По умолчанию: 30.0
  min_deposit: 30.0

  # Множители уверенности → размер позиции
  # Чем выше ML-скор сигнала — тем больше маржа
  score_multipliers:
    8.5: 1.4     # Очень высокая уверенность: +40% к базовой марже
    7.5: 1.15    # Высокая уверенность: +15%
    6.5: 1.0     # Нормальная уверенность: базовая маржа
    5.5: 0.75    # Низкая уверенность: −25%

# ═══════════════════════════════════════════════════════════════════════════════
# 10. WATCHLIST — список отслеживаемых монет
# ═══════════════════════════════════════════════════════════════════════════════
watchlist:
  # Режим формирования вотчлиста:
  #   top   — автоматически: top-N по объёму на Bybit
  #   fixed — фиксированный список (см. поле fixed)
  # Тип: строка | Значения: "top", "fixed" | По умолчанию: "top"
  mode: "top"

  # Количество монет в топе (режим top)
  # Диапазон: 10–200 | По умолчанию: 50
  top_n: 50

  # Исключения из вотчлиста (не отслеживаются ни в каком режиме)
  # Тип: список строк | По умолчанию: ["BTCUSDT", "ETHUSDT"]
  exclude: ["BTCUSDT", "ETHUSDT"]

  # Фиксированный список (используется при mode=fixed)
  # Пример: ["SOLUSDT", "ADAUSDT", "LINKUSDT"]
  # fixed: []

# ═══════════════════════════════════════════════════════════════════════════════
# 11. LOGGING — настройки логирования
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  # Максимальный размер events.log до ротации (МБ)
  # Диапазон: 10–500 | По умолчанию: 50
  max_size_mb: 50

  # Количество ротированных файлов лога (events.log, events.log.1, ...)
  # Диапазон: 1–30 | По умолчанию: 7
  max_files: 7

  # Формат лога: json (структурированный) или text (человекочитаемый)
  # Тип: строка | Значения: "json", "text" | По умолчанию: "json"
  format: "json"

  # Максимальный размер trades.jsonl до ротации (МБ)
  # Диапазон: 10–1000 | По умолчанию: 100
  trades_max_size_mb: 100

  # Архивировать старые trades-файлы в .gz
  # Тип: bool | По умолчанию: true
  trades_archive: true
